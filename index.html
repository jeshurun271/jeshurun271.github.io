<!DOCTYPE html>
<html>
<head>
<title>ML + NLP Student Tutor</title>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@3.21.0"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/universal-sentence-encoder"></script>

<style>
body{margin:0;font-family:Arial;background:#020617;color:white;text-align:center;}
textarea{width:90%;height:80px;padding:10px;border-radius:8px;}
button{margin-top:10px;padding:10px;border:none;border-radius:8px;background:#38bdf8;}
#log{margin:20px;background:#1e293b;padding:15px;border-radius:10px;text-align:left;}
.bar{height:15px;background:#334155;border-radius:10px;}
.fill{height:100%;background:#22c55e;width:0;}
.highlight{color:#f87171;font-weight:bold;}
</style>
</head>

<body>

<button onclick="document.documentElement.requestFullscreen()" style="position:absolute;right:10px;top:10px">Fullscreen</button>

<h1>Machine Learning + NLP Tutor</h1>

<textarea id="text" placeholder="Type any sentence..."></textarea><br>
<button onclick="run()">Analyze</button>

<div class="bar"><div class="fill" id="conf"></div></div>

<div id="log"></div>

<script>
let model;
use.load().then(m=>model=m);

function wait(ms){return new Promise(r=>setTimeout(r,ms));}

async function run(){

let input=document.getElementById("text").value;
let log=document.getElementById("log");
log.innerHTML="🤖 Reading text...<br>";
await wait(600);

log.innerHTML+="📦 Breaking sentence into meaning vectors...<br>";
await wait(600);

const emb=await model.embed([input]);
let score=Math.random()*2-1;   // simulate classifier

let percent=Math.round(Math.abs(score)*100);
document.getElementById("conf").style.width=percent+"%";

let label=
score>0.6?"Very Positive 😄":
score>0.2?"Positive 🙂":
score>-0.2?"Neutral 😐":
score>-0.6?"Negative 😟":
"Very Negative 😡";

log.innerHTML+="🧠 Neural Network comparing patterns...<br>";
await wait(600);

log.innerHTML+="📊 Confidence: "+percent+"%<br>";
await wait(400);

log.innerHTML+="✅ FINAL RESULT: <b>"+label+"</b>";

}
</script>

</body>
</html>
